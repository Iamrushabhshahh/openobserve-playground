name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work. Alternatives you considered are welcome too.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this
