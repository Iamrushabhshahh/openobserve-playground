[project]
name = "agent-obs-mcp"
version = "0.1.0"
description = "Read-only MCP server for Claude Code telemetry and WHOOP health data stored in OpenObserve"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
agent-obs-mcp = "agent_obs_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_obs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/agent_obs_mcp/resources.py" = ["E501"]
"src/agent_obs_mcp/server.py" = ["E501"]  # one-line tool descriptions read better unwrapped
